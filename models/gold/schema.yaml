version: 2

models:

  # =========================================================
  # DIMENSION TABLES
  # =========================================================

  - name: dim_product
    description: >
      CONFIRMED via sample data. Product dimension. ProductKey is a
      surrogate hash key, ProductID the natural key from source.
      SupplierID is carried as a text FK to dim_supplier.supplier_id (no
      supplier_key stored directly on this dimension -- fact tables reach
      SupplierKey via dim_product -> supplier_id -> dim_supplier).
    columns:
      - name: product_key
        description: Surrogate key (hash).
        tests:
          - unique
          - not_null
      - name: product_id
        description: Natural key from source.
        tests:
          - not_null
          - unique
      - name: supplier_id
        description: Text FK to dim_supplier.supplier_id.
        tests:
          - not_null
          - relationships:
              to: ref('dim_supplier')
              field: supplier_id
      - name: cost_price
        tests:
          - not_null
      - name: unit_price
        tests:
          - not_null
      - name: profit_margin_percentage
      - name: low_stock_flag
        tests:
          - accepted_values:
              values: [true, false]

  - name: dim_supplier
    description: >
      CONFIRMED via sample data. Supplier dimension. SupplierKey is a
      surrogate hash key.
    columns:
      - name: supplier_key
        description: Surrogate key (hash).
        tests:
          - unique
          - not_null
      - name: supplier_id
        description: Natural key from source.
        tests:
          - not_null
          - unique
      - name: supplier_name
        tests:
          - not_null
      - name: supplier_type
      - name: payment_terms
      - name: on_time_delivery_rate
        description: >
          CONFIRMED to exist. Already a whole percentage (e.g. 81.30
          meaning 81.30%), no /100 correction needed.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
              config:
                severity: warn

  - name: dim_store
    description: >
      CONFIRMED via sample data. Store dimension. StoreKey is a surrogate
      hash key. size_category confirmed as the correct column name
      (distinct from Silver's store_size_category -- naming differs
      between layers).
    columns:
      - name: store_key
        description: Surrogate key (hash).
        tests:
          - unique
          - not_null
      - name: store_id
        description: Natural key from source (format STOREnnn).
        tests:
          - not_null
          - unique
      - name: store_name
        tests:
          - not_null
      - name: region
      - name: store_type
      - name: opening_date
        tests:
          - not_null
      - name: size_category
        description: CONFIRMED column name and values.
        tests:
          - accepted_values:
              values: ['Small', 'Medium', 'Large']

  - name: dim_date
    description: >
      CONFIRMED via sample data. Date dimension generated from a
      dbt_utils.date_spine spanning 2024-04-01 to 2024-09-27, per the PS
      build note. Gap-free by construction.

      CORRECTION: date_key is a surrogate HASH string (e.g.
      "70edc7a9e19938d258df30ed87f6cac6"), NOT a YYYYMMDD integer as
      previously documented. Confirmed consistent with the hash-format
      date_key used in fact_inventory and fact_marketingperformance, so
      joins are unaffected -- this was a documentation error only, not a
      test failure or functional bug.

      quarter is stored as a string label (e.g. "Q2"), not an integer.
    columns:
      - name: date_key
        description: Surrogate key (hash string, not YYYYMMDD integer).
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - unique
          - not_null
      - name: year
        tests:
          - not_null
      - name: quarter
        description: String label format (e.g. "Q2"), not an integer.
        tests:
          - not_null
      - name: month
        tests:
          - not_null
      - name: day_of_week
        tests:
          - not_null
      - name: holiday_flag
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: season
        description: CONFIRMED values via sample data.
        tests:
          - accepted_values:
              values: ['Spring', 'Summer', 'Fall', 'Winter']

  - name: dim_campaign
    description: >
      CONFIRMED via sample data. Marketing campaign dimension, built from
      an SCD Type 2 snapshot. Only current rows (dbt_valid_to IS NULL)
      should be used for joins from fact tables.
    columns:
      - name: campaign_key
        description: Surrogate key (hash).
        tests:
          - unique
          - not_null
      - name: campaign_id
        description: Natural key from source.
        tests:
          - not_null
      - name: campaign_name
      - name: campaign_type
        description: >
          CONFIRMED to exist. rpt_roi_by_campaign_type.sql correctly
          groups by this column.
        tests:
          - not_null
      - name: channel
      - name: audience_segment
        description: >
          CONFIRMED column name. NOTE: rpt_sales_impact_of_campaigns.sql
          and rpt_customer_engagement_by_campaign.sql currently reference
          dc.target_audience_segment, which does NOT exist -- those two
          views need to be corrected to use audience_segment instead, or
          they will fail to compile.
      - name: budget
        tests:
          - not_null
      - name: total_cost
        tests:
          - not_null
      - name: total_revenue
        description: >
          Self-reported figure from source data, NOT the same as
          attributed sales computed in Gold's FACT_MarketingPerformance.
      - name: start_date
        tests:
          - not_null
      - name: end_date
        tests:
          - not_null
      - name: campaign_duration_days
      - name: dbt_valid_to
        description: >
          NULL indicates the current version of the campaign record.
          Non-null rows represent historical SCD versions and should not
          be joined against by fact tables.

  - name: dim_customer
    description: >
      CONFIRMED via sample data. Customer dimension. customer_key is a
      simple integer surrogate key (not a hash, unlike other Gold
      dimensions -- confirm this is intentional).
    columns:
      - name: customer_key
        description: Surrogate key (integer, not hash).
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Natural key from source.
        tests:
          - not_null
          - unique
      - name: full_name
      - name: email
      - name: is_valid_email
        tests:
          - accepted_values:
              values: [true, false]
      - name: phone_number
      - name: is_valid_phone
        tests:
          - accepted_values:
              values: [true, false]
      - name: age
      - name: customer_segment
        description: CONFIRMED column name and values.
        tests:
          - accepted_values:
              values: ['Young', 'Middle-aged', 'Senior']
      - name: loyalty_tier
      - name: total_purchases
      - name: total_spend

  # =========================================================
  # FACT TABLES
  # =========================================================

  - name: fact_inventory
    description: >
      CONFIRMED via sample data. Grain: one row per product per store per
      date, per PS spec.

      DATA LIMITATION: the product source has no store-level stock
      breakdown -- beginning_inventory, ending_inventory, and
      purchased_quantity are company-wide values duplicated across every
      store row for a given product+date (not genuinely store-specific).
      Only sold_quantity (sourced from orders, which does carry store_id)
      and supplier_contribution_percentage (a true cross-product,
      pre-cross-join aggregate) are genuinely accurate per store/supplier.
    columns:
      - name: inventory_key
        description: Surrogate key (hash of product_id, store_id, snapshot_date).
        tests:
          - unique
          - not_null
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: store_key
        tests:
          - relationships:
              to: ref('dim_store')
              field: store_key
      - name: supplier_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_supplier')
              field: supplier_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: beginning_inventory
      - name: purchased_quantity
        description: >
          Inferred delta (ending - beginning + sold); no receiving events
          are recorded in source data, so this can legitimately be
          negative (unobserved shrinkage/returns) per the PS's own
          "inferred, not observed" caveat.
      - name: sold_quantity
        tests:
          - not_null
      - name: ending_inventory
      - name: inventory_value
      - name: stock_turnover_ratio
        description: Sold / average inventory, NULL when average inventory is 0.
      - name: supplier_contribution_percentage
        description: >
          Supplier's share of total units purchased across all products
          on that date. Negative purchased_quantity deltas are clamped to
          0 before aggregation so this never goes negative.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
              config:
                severity: warn

  - name: fact_marketingperformance
    description: >
      CONFIRMED via sample data. Grain: one row per campaign per date.
    columns:
      - name: marketing_performance_key
        description: Surrogate key (hash of campaign_key, activity_date).
        tests:
          - unique
          - not_null
      - name: campaign_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_campaign')
              field: campaign_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: total_sales_influenced
        description: Daily net sales attributed to the campaign (not cumulative).
      - name: new_customers_acquired
        description: >
          Daily count of customers whose true first-ever completed
          purchase (across all their orders, not just campaign-attributed
          ones) fell on this date and was attributed to this campaign.
      - name: repeat_purchase_rate
        description: >
          Cumulative-to-date: 100 * cumulative repeat-purchase customers /
          cumulative first-purchase customers for this campaign. NULL when
          the denominator is 0.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              config:
                severity: warn
      - name: roi
        description: >
          Cumulative-to-date: (cumulative sales influenced - total
          campaign cost) / total campaign cost * 100. NULL when
          total_cost is 0. Can legitimately be negative (campaign has not
          yet broken even).
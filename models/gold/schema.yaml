version: 2

models:

  # =========================================================
  # DIMENSION TABLES
  # =========================================================

  - name: dim_product
    description: >
      Product dimension. ProductKey is the surrogate key, ProductID the
      natural key from source. SupplierID is carried as a text FK to
      dim_supplier.supplier_id (no supplier_key stored directly on this
      dimension -- fact tables reach SupplierKey via dim_product -> supplier_id
      -> dim_supplier).
    columns:
      - name: product_key
        description: Surrogate key.
        tests:
          - unique
          - not_null
      - name: product_id
        description: Natural key from source.
        tests:
          - not_null
          - unique
      - name: supplier_id
        description: Text FK to dim_supplier.supplier_id.
        tests:
          - not_null
          - relationships:
              to: ref('dim_supplier')
              field: supplier_id
      - name: cost_price
        tests:
          - not_null
      - name: unit_price
        tests:
          - not_null

  - name: dim_supplier
    description: Supplier dimension. SupplierKey is the surrogate key.
    columns:
      - name: supplier_key
        description: Surrogate key.
        tests:
          - unique
          - not_null
      - name: supplier_id
        description: Natural key from source.
        tests:
          - not_null
          - unique

  - name: dim_store
    description: >
      Store dimension. StoreKey is the surrogate key. NOTE: column names
      below (size_category, store_type) are assumed per the PS's declared
      DIM_Store field list -- confirm against the actual model output,
      since this dimension's structure was not directly verified via
      sample data in this project's build process.
    columns:
      - name: store_key
        description: Surrogate key.
        tests:
          - unique
          - not_null
      - name: store_id
        description: Natural key from source (format STOREnnn).
        tests:
          - not_null
          - unique
      - name: size_category
        description: >
          Derived store size band. ASSUMPTION -- confirm exact column name
          and values against the actual dim_store model.
        tests:
          - accepted_values:
              values: ['Small', 'Medium', 'Large']
              config:
                severity: warn

  - name: dim_date
    description: >
      Date dimension generated from a dbt_utils.date_spine spanning
      2024-04-01 to 2024-09-27, per the PS build note. Gap-free by
      construction.
    columns:
      - name: date_key
        description: Surrogate key (YYYYMMDD integer format).
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - unique
          - not_null
      - name: year
        tests:
          - not_null
      - name: quarter
        tests:
          - not_null
      - name: month
        tests:
          - not_null
      - name: day_of_week
        tests:
          - not_null
      - name: holiday_flag
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: season
        description: >
          ASSUMPTION on accepted values -- confirm actual season labels
          used in the model (e.g. Spring/Summer/Fall/Winter vs other
          naming).
        tests:
          - accepted_values:
              values: ['Spring', 'Summer', 'Fall', 'Winter']
              config:
                severity: warn

  - name: dim_campaign
    description: >
      Marketing campaign dimension, built from an SCD Type 2 snapshot.
      Only current rows (dbt_valid_to IS NULL) should be used for joins
      from fact tables -- enforced at the source snapshot level.
    columns:
      - name: campaign_key
        description: Surrogate key.
        tests:
          - unique
          - not_null
      - name: campaign_id
        description: Natural key from source.
        tests:
          - not_null
      - name: budget
        tests:
          - not_null
      - name: total_cost
        tests:
          - not_null
      - name: start_date
        tests:
          - not_null
      - name: end_date
        tests:
          - not_null
      - name: dbt_valid_to
        description: >
          NULL indicates the current version of the campaign record.
          Non-null rows represent historical SCD versions and should not
          be joined against by fact tables.

  - name: dim_customer
    description: >
      Customer dimension. NOTE: this dimension exists in the project but
      is not explicitly declared in the PS's Gold Layer dimension list
      (DIM_Product, DIM_Supplier, DIM_Store, DIM_Date, DIM_MarketingCampaign
      only) -- it is implied by CustomerKey references in the
      FACT_MarketingPerformance formulas. Column names below are assumed;
      confirm against the actual model.
    columns:
      - name: customer_key
        description: Surrogate key.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Natural key from source.
        tests:
          - not_null
          - unique
      - name: customer_segment
        description: >
          Customer age band, per the PS's canonical 18-35 / 36-55 / 56+
          bands (Young / Middle-aged / Senior).
        tests:
          - accepted_values:
              values: ['Young', 'Middle-aged', 'Senior']
              config:
                severity: warn

  # =========================================================
  # FACT TABLES
  # =========================================================

  - name: fact_inventory
    description: >
      Grain: one row per product per store per date, per PS spec.

      DATA LIMITATION: the product source has no store-level stock
      breakdown -- beginning_inventory, ending_inventory, and
      purchased_quantity are company-wide values duplicated across every
      store row for a given product+date (not genuinely store-specific).
      Only sold_quantity (sourced from orders, which does carry store_id)
      and supplier_contribution_percentage (a true cross-product,
      pre-cross-join aggregate) are genuinely accurate per store/supplier.
    columns:
      - name: inventory_key
        description: Surrogate key (hash of product_id, store_id, snapshot_date).
        tests:
          - unique
          - not_null
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: store_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_key
      - name: supplier_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_supplier')
              field: supplier_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: beginning_inventory
      - name: purchased_quantity
        description: >
          Inferred delta (ending - beginning + sold); no receiving events
          are recorded in source data, so this can legitimately be
          negative (unobserved shrinkage/returns) per the PS's own
          "inferred, not observed" caveat.
      - name: sold_quantity
        tests:
          - not_null
      - name: ending_inventory
      - name: inventory_value
      - name: stock_turnover_ratio
        description: Sold / average inventory, NULL when average inventory is 0.
      - name: supplier_contribution_percentage
        description: >
          Supplier's share of total units purchased across all products
          on that date. Negative purchased_quantity deltas are clamped to
          0 before aggregation so this never goes negative.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
              config:
                severity: warn

  - name: fact_marketingperformance
    description: >
      Grain: one row per campaign per date.

      ATTRIBUTION RULE (per PS requirement -- stated here per the doc's
      instruction that it "must be defined in the model documentation"):
      an order is attributed to whatever CAMPAIGN_ID is recorded directly
      on it in s_orders. No last-touch or lookback-window logic is
      applied, since source data assigns campaign attribution at the
      order level already. Orders are additionally guarded to fall within
      the campaign's own start/end window before counting toward any
      metric.

      DOCUMENTED ASSUMPTION (spec ambiguity): the PS declares this fact's
      grain as per-date, but the ROI and Repeat Purchase Rate formulas
      reference "TotalCampaignCost" -- a single whole-campaign figure, not
      a daily one. Resolution: total_sales_influenced and
      new_customers_acquired are DAILY (additive, safe to roll up in
      reporting views). roi and repeat_purchase_rate are computed
      CUMULATIVE-TO-DATE per campaign, producing a trend line that is
      meaningful against the fixed total campaign cost.
    columns:
      - name: marketing_performance_key
        description: Surrogate key (hash of campaign_key, activity_date).
        tests:
          - unique
          - not_null
      - name: campaign_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_campaign')
              field: campaign_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: total_sales_influenced
        description: Daily net sales attributed to the campaign (not cumulative).
      - name: new_customers_acquired
        description: >
          Daily count of customers whose true first-ever completed
          purchase (across all their orders, not just campaign-attributed
          ones) fell on this date and was attributed to this campaign.
      - name: repeat_purchase_rate
        description: >
          Cumulative-to-date: 100 * cumulative repeat-purchase customers /
          cumulative first-purchase customers for this campaign. NULL when
          the denominator is 0.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              config:
                severity: warn
      - name: roi
        description: >
          Cumulative-to-date: (cumulative sales influenced - total
          campaign cost) / total campaign cost * 100. NULL when
          total_cost is 0. Can legitimately be negative (campaign has not
          yet broken even).